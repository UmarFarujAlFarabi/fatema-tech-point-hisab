<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12382d"><meta name="description" content="Fatema Tech Point Hisab - offline khata">
<link rel="manifest" href="manifest.json">
<title>Fatema Tech Point Hisab</title>
<style>
:root{--green:#12382d;--mint:#d9f5aa;--bg:#f4f7f4;--card:#fff;--text:#17231e;--muted:#68766f;--red:#b42318;--line:#e2e9e3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;padding-bottom:78px}
header{background:var(--green);color:white;padding:20px 16px 24px;border-radius:0 0 24px 24px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:900;font-size:23px}
h1{font-size:18px;margin:0}header p{margin:3px 0 0;color:#d9e8df;font-size:12px}
.balance-label{margin-top:23px;font-size:13px;color:#d9e8df}.balance{font-size:30px;font-weight:800;margin-top:2px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 14px 0}.metric{background:var(--card);padding:14px;border-radius:16px;box-shadow:0 3px 12px #153d2b0b}.metric small{color:var(--muted)}.metric strong{display:block;font-size:19px;margin-top:5px}.green{color:#18794e}.red{color:var(--red)}
main{padding:18px 14px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}.section-head h2{font-size:17px;margin:0}
button{border:0;border-radius:12px;padding:11px 14px;background:var(--green);color:#fff;font-weight:700;font-size:14px;cursor:pointer}.secondary{background:#e8efe9;color:var(--green)}.danger{background:#fff0ef;color:var(--red)}input,select,textarea{width:100%;padding:12px;border:1px solid #d5dfd7;border-radius:11px;background:white;font:inherit;margin-top:6px;outline-color:#60966d}label{display:block;font-size:13px;color:#42534a;margin:12px 0 0}.search{margin:0 0 12px}.customer,.entry,.empty{background:white;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:9px}.customer-top{display:flex;justify-content:space-between;gap:10px}.customer-name{font-weight:750}.sub{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:800;white-space:nowrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions button{padding:8px 10px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:24px}
nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:white;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{background:white;color:#64736a;padding:7px 3px;font-size:12px}nav button.active{background:#e9f4e4;color:var(--green)}nav span{display:block;font-size:19px;margin-bottom:2px}
.modal{display:none;position:fixed;inset:0;background:#0a1a12a6;z-index:10;padding:20px 12px;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:var(--bg);border-radius:22px 22px 12px 12px;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet h2{font-size:18px;margin:0}.form-buttons{display:flex;gap:8px;margin-top:16px}.form-buttons button{flex:1}.notice{font-size:12px;color:var(--muted);line-height:1.5;margin:10px 0}.tag{font-size:11px;border-radius:99px;padding:4px 8px;background:#e9f4e4;color:#24613d}
#toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#152c22;color:white;padding:10px 15px;border-radius:12px;display:none;z-index:20;font-size:13px}
</style></head>
<body>
<header><div class="brand"><div class="logo">F</div><div><h1>Fatema Tech Point</h1><p>ডিজিটাল হিসাব খাতা</p></div><div style="margin-left:auto" class="tag">অফলাইন</div></div><div class="balance-label">মোট পাওনা (কাস্টমারদের কাছে)</div><div class="balance" id="totalDue">৳ ০</div></header>
<section class="metrics"><div class="metric"><small>আজকের জমা</small><strong class="green" id="todayPaid">৳ ০</strong></div><div class="metric"><small>আজকের বাকি যোগ</small><strong class="red" id="todayDue">৳ ০</strong></div></section>
<main id="main"></main>
<nav><button data-tab="customers" class="active"><span>👥</span>কাস্টমার</button><button data-tab="transactions"><span>↔️</span>লেনদেন</button><button data-tab="reports"><span>📊</span>রিপোর্ট</button></nav>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle">নতুন কাস্টমার</h2><button class="secondary" id="closeModal">বন্ধ</button></div><div id="modalBody"></div></div></div><div id="toast"></div>
<script>
const KEY='ftp_hisab_v1';let state=load(),tab='customers',search='';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{customers:[],tx:[]}}catch(e){return{customers:[],tx:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function money(n){return '৳ '+Number(n||0).toLocaleString('bn-BD',{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function balance(id){return state.tx.filter(t=>t.customerId===id).reduce((s,t)=>s+(t.type==='due'?t.amount:-t.amount),0)}
function toast(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function render(){let due=state.customers.reduce((s,c)=>s+Math.max(0,balance(c.id)),0);document.getElementById('totalDue').textContent=money(due);
let todays=state.tx.filter(t=>t.date===today());document.getElementById('todayPaid').textContent=money(todays.filter(t=>t.type==='paid').reduce((s,t)=>s+t.amount,0));document.getElementById('todayDue').textContent=money(todays.filter(t=>t.type==='due').reduce((s,t)=>s+t.amount,0));
let main=document.getElementById('main');
if(tab==='customers'){main.innerHTML=`<div class="section-head"><h2>কাস্টমার তালিকা</h2><button onclick="customerForm()">＋ যোগ করুন</button></div><input class="search" placeholder="নাম বা ফোন দিয়ে খুঁজুন" value="${esc(search)}" oninput="search=this.value;render()"><div id="customerList"></div>`;
let list=state.customers.filter(c=>(c.name+' '+(c.phone||'')).toLowerCase().includes(search.toLowerCase()));let el=document.getElementById('customerList');el.innerHTML=list.length?list.map(c=>`<div class="customer"><div class="customer-top"><div><div class="customer-name">${esc(c.name)}</div><div class="sub">${esc(c.phone||'ফোন নম্বর নেই')}</div></div><div class="amount ${balance(c.id)>0?'red':'green'}">${money(balance(c.id))}</div></div><div class="actions"><button onclick="txForm('${c.id}','due')">＋ বাকি দিন</button><button class="secondary" onclick="txForm('${c.id}','paid')">৳ জমা নিন</button><button class="secondary" onclick="historyFor('${c.id}')">হিসাব দেখুন</button><button class="secondary" onclick="customerForm('${c.id}')">সম্পাদনা</button><button class="danger" onclick="deleteCustomer('${c.id}')">🗑 ডিলিট</button></div></div>`).join(''):'<div class="empty">এখনো কোনো কাস্টমার নেই। ＋ যোগ করুন চাপুন।</div>'}
else if(tab==='transactions'){let tx=[...state.tx].sort((a,b)=>(b.date+b.created).localeCompare(a.date+a.created));main.innerHTML=`<div class="section-head"><h2>সাম্প্রতিক লেনদেন</h2><button onclick="txForm()">＋ লেনদেন</button></div>${tx.length?tx.map(t=>{let c=state.customers.find(c=>c.id===t.customerId);return `<div class="entry"><div class="customer-top"><div><b>${esc(c?.name||'মুছে ফেলা কাস্টমার')}</b><div class="sub">${esc(t.date)} · ${esc(t.note||'বিবরণ নেই')}</div></div><div class="amount ${t.type==='due'?'red':'green'}">${t.type==='due'?'+':'−'} ${money(t.amount)}</div></div></div>`}).join(''):'<div class="empty">এখনো কোনো লেনদেন নেই।</div>'}`}
else {let allDue=state.customers.reduce((s,c)=>s+Math.max(0,balance(c.id)),0),allPaid=state.tx.filter(t=>t.type==='paid').reduce((s,t)=>s+t.amount,0),allNew=state.tx.filter(t=>t.type==='due').reduce((s,t)=>s+t.amount,0);main.innerHTML=`<div class="section-head"><h2>হিসাবের রিপোর্ট</h2><button onclick="exportData()">ব্যাকআপ</button></div><div class="metric" style="margin-bottom:10px"><small>মোট কাস্টমার</small><strong>${state.customers.length.toLocaleString('bn-BD')}</strong></div><div class="metric" style="margin-bottom:10px"><small>মোট বাকি যোগ</small><strong class="red">${money(allNew)}</strong></div><div class="metric" style="margin-bottom:10px"><small>মোট জমা গ্রহণ</small><strong class="green">${money(allPaid)}</strong></div><div class="metric" style="margin-bottom:10px"><small>বর্তমান মোট পাওনা</small><strong>${money(allDue)}</strong></div><button class="secondary" onclick="document.getElementById('importFile').click()">ব্যাকআপ ফিরিয়ে আনুন</button><input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)"><p class="notice">এই সংস্করণে তথ্য এই ফোনের ব্রাউজারে থাকে। ব্রাউজারের ডেটা মুছে ফেললে হিসাব হারাতে পারে। নিয়মিত ব্যাকআপ নিন। ক্লাউড সিঙ্ক এখনো যুক্ত হয়নি।</p><button class="danger" onclick="clearAll()">সব হিসাব মুছুন</button>`}
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('closeModal').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function customerForm(id){let c=state.customers.find(x=>x.id===id)||{name:'',phone:'',address:''};openModal(id?'কাস্টমার সম্পাদনা':'নতুন কাস্টমার',`<form id="custForm"><label>কাস্টমারের নাম *</label><input name="name" required maxlength="100" value="${esc(c.name)}" placeholder="নাম লিখুন"><label>মোবাইল নম্বর</label><button type="button" class="secondary" style="width:100%;margin-top:6px" onclick="pickPhoneContact()">📱 ফোনবুক থেকে কাস্টমার নিন</button><input name="phone" inputmode="tel" value="${esc(c.phone)}" placeholder="01XXXXXXXXX"><label>ঠিকানা / নোট</label><textarea name="address" rows="2">${esc(c.address)}</textarea><div class="form-buttons"><button type="button" class="secondary" onclick="closeModal()">বাতিল</button><button>সেভ করুন</button></div></form>`);document.getElementById('custForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),data={name:f.get('name').trim(),phone:f.get('phone').trim(),address:f.get('address').trim()};if(id)Object.assign(c,data);else state.customers.push({id:crypto.randomUUID(),...data});closeModal();save();toast('কাস্টমারের তথ্য সেভ হয়েছে')}}
async function pickPhoneContact(){
  const form=document.getElementById('custForm');
  if(!('contacts' in navigator) || typeof navigator.contacts.select!=='function'){
    toast('এই ব্রাউজারে ফোনবুক থেকে নেওয়া সমর্থিত নয়। Android Chrome-এ চেষ্টা করুন।');
    return;
  }
  try{
    const contacts=await navigator.contacts.select(['name','tel'],{multiple:false});
    if(!contacts || !contacts.length)return;
    const contact=contacts[0];
    const name=(contact.name&&contact.name[0])||'';
    const phone=(contact.tel&&contact.tel[0])||'';
    if(name)form.elements.name.value=name;
    if(phone)form.elements.phone.value=phone;
    if(!name && !phone)toast('এই কন্টাক্টে নাম বা ফোন নম্বর নেই');
  }catch(err){ if(err && err.name!=='AbortError')toast('কন্টাক্ট নেওয়া যায়নি। আবার চেষ্টা করুন।'); }
}
function txForm(customerId,type){if(!state.customers.length){toast('আগে একজন কাস্টমার যোগ করুন');customerForm();return}let options=state.customers.map(c=>`<option value="${c.id}" ${c.id===customerId?'selected':''}>${esc(c.name)}${c.phone?' — '+esc(c.phone):''}</option>`).join('');openModal(type==='paid'?'জমা গ্রহণ':type==='due'?'বাকি যোগ করুন':'নতুন লেনদেন',`<form id="txForm"><label>কাস্টমার *</label><select name="customerId" required>${options}</select><label>লেনদেনের ধরন</label><select name="type"><option value="due" ${type==='due'?'selected':''}>বাকি যোগ (কাস্টমার পাবে)</option><option value="paid" ${type==='paid'?'selected':''}>জমা গ্রহণ (বাকি কমবে)</option></select><label>টাকার পরিমাণ (৳) *</label><input name="amount" type="number" min="0.01" step="0.01" required inputmode="decimal" placeholder="যেমন 1500"><label>তারিখ *</label><input name="date" type="date" required value="${today()}"><label>বিবরণ</label><input name="note" maxlength="160" placeholder="মোবাইল বিক্রি / টাকা জমা / মেরামত"><div class="form-buttons"><button type="button" class="secondary" onclick="closeModal()">বাতিল</button><button>সেভ করুন</button></div></form>`);document.getElementById('txForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount'));if(!(amount>0)){toast('সঠিক টাকার পরিমাণ দিন');return}state.tx.push({id:crypto.randomUUID(),customerId:f.get('customerId'),type:f.get('type'),amount,date:f.get('date'),note:f.get('note').trim(),created:Date.now()});closeModal();save();toast('লেনদেন সেভ হয়েছে')}}
function deleteCustomer(id){let c=state.customers.find(x=>x.id===id);if(!c)return;let count=state.tx.filter(t=>t.customerId===id).length;let msg=`${c.name} কাস্টমারকে ডিলিট করবেন?`+(count?`
এই কাস্টমারের ${count}টি লেনদেনও মুছে যাবে।`:'')+'
আগে ব্যাকআপ নেওয়া ভালো।';if(!confirm(msg))return;state.customers=state.customers.filter(x=>x.id!==id);state.tx=state.tx.filter(t=>t.customerId!==id);save();toast('কাস্টমার ও তার লেনদেন ডিলিট হয়েছে')}
function historyFor(id){let c=state.customers.find(c=>c.id===id);let tx=state.tx.filter(t=>t.customerId===id).sort((a,b)=>(a.date+a.created).localeCompare(b.date+b.created));openModal(c.name+' — হিসাব',`<div class="metric"><small>বর্তমান বাকি</small><strong>${money(balance(id))}</strong></div><div style="margin-top:12px">${tx.length?tx.map(t=>`<div class="entry"><div class="customer-top"><div><b>${t.type==='due'?'বাকি যোগ':'জমা গ্রহণ'}</b><div class="sub">${esc(t.date)} · ${esc(t.note||'বিবরণ নেই')}</div></div><div class="amount ${t.type==='due'?'red':'green'}">${t.type==='due'?'+':'−'} ${money(t.amount)}</div></div></div>`).join(''):'<div class="empty">লেনদেন নেই</div>'}</div><div class="form-buttons"><button onclick="closeModal()">বন্ধ</button></div>`)}
function exportData(){let blob=new Blob([JSON.stringify({app:'Fatema Tech Point Hisab',version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fatema-hisab-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('ব্যাকআপ ফাইল তৈরি হয়েছে')}
function importData(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.customers)||!Array.isArray(d.tx))throw Error();if(!confirm('বর্তমান হিসাবের বদলে ব্যাকআপের তথ্য বসাবেন?'))return;state={customers:d.customers,tx:d.tx};save();toast('ব্যাকআপ ফিরিয়ে আনা হয়েছে')}catch(err){alert('সঠিক ব্যাকআপ ফাইল নয়')}};r.readAsText(file)}
function clearAll(){if(confirm('সতর্কতা: সব কাস্টমার ও লেনদেন স্থায়ীভাবে মুছে যাবে। আগে ব্যাকআপ নিয়েছেন?')&&confirm('নিশ্চিতভাবে সব তথ্য মুছবেন?')){state={customers:[],tx:[]};save();toast('সব তথ্য মুছে ফেলা হয়েছে')}}
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
